<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>happy birthday!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
  </head>

  <body>
    <div class="bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grain"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <span>i love you</span>
      </div>

      <nav class="nav">
        <a class="nav-link active" href="index.html">home</a>
        <a class="nav-link" href="notes.html">click me</a>
        <a class="nav-link" href="gallery.html">photos</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="hero card">
        <div class="hero-left">
          <div class="badge">💜 nov 2, 2025</div>

          <h1 class="hero-heading">happy birthday,<br>darling</h1>

          <div class="together card-soft">
            <div class="mini-title">we've been together for</div>
            <div class="timer" id="timerText">loading…</div>
            <div class="tiny muted">since nov 2, 2025</div>
          </div>

          <div class="cta-row">
            <a class="btn btn-primary" href="notes.html">
              click me
              <span class="btn-glow"></span>
            </a>

            <a class="btn btn-ghost" href="gallery.html">
              photos
            </a>
          </div>
        </div>

        <div class="hero-right">
          <div class="polaroid">
            <div class="polaroid-img" id="homePhoto"></div>
            <div class="polaroid-caption">us 💜</div>
          </div>

          <div class="mini-cards">
            <div class="mini card-soft">
              <div class="mini-title">today</div>
              <div class="mini-text" id="dailyLine">you're loved.</div>
            </div>

            <div class="mini card-soft">
              <div class="mini-title">tap me</div>
              <button class="btn btn-small" id="sparkleBtn">✨</button>
            </div>
          </div>
        </div>
      </section>

      <section class="card section">
        <div class="section-head">
          <h2 class="section-title">how are you feeling?</h2>
        </div>

        <div class="grid quick-grid">
          <a class="tile tile-sad" href="notes.html#sad" data-tilt>
            <div class="tile-emoji">🥺</div>
            <div class="tile-title">sad</div>
          </a>

          <a class="tile tile-anxious" href="notes.html#anxious" data-tilt>
            <div class="tile-emoji">🌧️</div>
            <div class="tile-title">anxious</div>
          </a>

          <a class="tile tile-miss" href="notes.html#miss" data-tilt>
            <div class="tile-emoji">🫶</div>
            <div class="tile-title">miss you</div>
          </a>

          <a class="tile tile-sleep" href="notes.html#sleep" data-tilt>
            <div class="tile-emoji">🌙</div>
            <div class="tile-title">can't sleep</div>
          </a>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-inner">
          <span>made by william</span>
          <span class="footer-dot">•</span>
          <span class="muted">i love you</span>
        </div>
      </footer>
    </main>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
