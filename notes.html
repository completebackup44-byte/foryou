<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>click me 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
  </head>

  <body>
    <div class="bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <span class="bh" style="left:12%;animation-duration:17s;animation-delay:2s;font-size:10px">♥</span>
      <span class="bh" style="left:28%;animation-duration:14s;animation-delay:5s;font-size:9px">♡</span>
      <span class="bh" style="left:55%;animation-duration:19s;animation-delay:0s;font-size:12px">♥</span>
      <span class="bh" style="left:73%;animation-duration:15s;animation-delay:7s;font-size:10px">✦</span>
      <span class="bh" style="left:88%;animation-duration:21s;animation-delay:3s;font-size:9px">♡</span>
      <div class="grain"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <span>for you</span>
      </div>

      <nav class="nav">
        <a class="nav-link" href="index.html">home</a>
        <a class="nav-link active" href="notes.html">click me</a>
        <a class="nav-link" href="gallery.html">photos</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="card section">
        <div class="section-head">
          <h1 class="section-title big">open when…</h1>
        </div>

        <div class="tools">
          <input class="search" id="search" placeholder="search (sad, miss, sleep...)">
          <button class="btn btn-primary" id="randomBtn">
            random
            <span class="btn-glow"></span>
          </button>
        </div>

        <div class="grid" id="notesGrid"></div>
      </section>

      <footer class="footer">
        <div class="footer-inner">
          <span>💜</span>
          <span class="footer-dot">•</span>
          <span class="muted">tap one</span>
        </div>
      </footer>
    </main>

    <div class="modal" id="modal">
      <div class="modal-card">
        <div class="modal-top">
          <div class="modal-title" id="modalTitle">title</div>
          <button class="icon-btn" id="closeModal" aria-label="Close">✕</button>
        </div>

        <div class="modal-body">
          <div class="pill-row" id="pillRow"></div>
          <article class="note" id="noteText">…</article>
        </div>

        <div class="modal-bottom">
          <button class="btn btn-ghost" id="prevNote">prev</button>
          <button class="btn btn-ghost" id="nextNote">next</button>
          <button class="btn btn-primary" id="copyNote">
            copy
            <span class="btn-glow"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="notes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
