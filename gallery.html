<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>i love you 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
  </head>

  <body>
    <div class="bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grain"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <span>for you</span>
      </div>

      <nav class="nav">
        <a class="nav-link" href="index.html">home</a>
        <a class="nav-link" href="notes.html">click me</a>
        <a class="nav-link active" href="gallery.html">photos</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="card section">
        <div class="section-head">
          <h1 class="section-title big">photos</h1>
          <p class="section-subtitle">heres a bunch of pics of me since you like them so much (idk why) some you may have some you may not have and ill add some more as time goes on.. maybe</p>
          <p class="muted small" id="photoCount"></p>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
      </section>

      <footer class="footer">
        <div class="footer-inner">
          <span>💜</span>
          <span class="footer-dot">•</span>
          <span class="muted">click to zoom · ← → to browse</span>
        </div>
      </footer>
    </main>

    <div class="modal" id="imgModal">
      <div class="modal-card modal-img">
        <div class="modal-top">
          <div class="modal-title" id="imgTitle">photo</div>
          <button class="icon-btn" id="closeImg" aria-label="Close">✕</button>
        </div>

        <div class="modal-body modal-img-body">
          <button class="img-nav img-nav-prev" id="imgPrev" aria-label="Previous">‹</button>
          <img id="zoomedImg" class="zoomed" alt="">
          <button class="img-nav img-nav-next" id="imgNext" aria-label="Next">›</button>
        </div>
      </div>
    </div>

    <script src="gallery.js"></script>
    <script src="app.js"></script>
  </body>
</html>
